[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "forgepilot"
version = "0.1.0"
description = "CLI coding assistant with MCP + RAG"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "typer>=0.12.3",
  "rich>=13.7.1",
  "pydantic>=2.8.2",
  "pydantic-settings>=2.4.0",
  "python-dotenv>=1.0.1",
  "langchain>=0.2.12",
  "langchain-text-splitters>=0.2.2",
  "langchain-openai>=0.1.22",
  "langchain-anthropic>=0.1.23",
  "langchain-groq>=0.1.9",
  "langchain-ollama>=0.1.1",
  "mcp>=1.2.0",
  "chromadb>=0.5.5",
  "sentence-transformers>=3.0.1"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3.2",
  "pytest-cov>=5.0.0",
  "ruff>=0.5.7",
  "mypy>=1.11.1"
]

[project.scripts]
forgepilot = "forgepilot.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.mypy]
python_version = "3.11"
strict = false
warn_unused_configs = true
